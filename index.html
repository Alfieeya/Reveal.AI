<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reveal.AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    height:100%;
    font-family:Segoe UI, Arial, sans-serif;
    background:#ffffff;
}

.landing{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    background:#ffffff;
}

.center-content{
    text-align:center;
    animation:fadeIn 1s ease;
}

.title{
    font-size:72px;
    font-weight:700;
    color:#1e3a8a;
    cursor:pointer;
    display:inline-block;
    transition:transform 1.4s ease;
}

.title:hover{
    transform:scale(1.05);
}

.expand{
    transform:scale(9);
}

.tagline{
    margin-top:18px;
    font-size:22px;
    color:#374151;
}

.white-screen{
    position:absolute;
    inset:0;
    background:#ffffff;
    opacity:0;
    transition:opacity .6s ease;
    pointer-events:none;
}

.white-screen.active{
    opacity:1;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:768px){

.title{
font-size:56px;
}

.tagline{
font-size:18px;
}

}
</style>

</head>

<body>

<div class="landing">

<div class="center-content">

<div id="revealText" class="title">
Reveal.AI
</div>

<div class="tagline">
Uncover the truth behind AI-generated media
</div>

</div>

<div id="whiteScreen" class="white-screen"></div>

</div>

<script>

const text=document.getElementById("revealText");
const whiteScreen=document.getElementById("whiteScreen");

text.addEventListener("click",()=>{

text.style.pointerEvents="none";

text.classList.add("expand");

setTimeout(()=>{
whiteScreen.classList.add("active");
},1300);

setTimeout(()=>{
window.location.href="app.html";
},1900);

});

</script>

</body>
</html>
